name: Build EduBF APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json
          echo '{"name":"edubf","version":"1.0.0","dependencies":{"@capacitor/android":"^6.0.0","@capacitor/core":"^6.0.0"},"devDependencies":{"@capacitor/cli":"^6.0.0"}}' > package.json
          printf "import type { CapacitorConfig } from '@capacitor/cli';\nconst config: CapacitorConfig = { appId: 'com.fasoecoleprobf.edubf', appName: 'EduBF', webDir: 'www', server: { androidScheme: 'https' } };\nexport default config;\n" > capacitor.config.ts
          npm install
      - name: Add Android
        run: npx cap add android || true
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduBF-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
