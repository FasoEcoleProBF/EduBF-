name: Build EduBF APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Preparer EduBF
        run: |
          mkdir -p EduBF
          cp index.html EduBF/
          cp manifest.json EduBF/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Creer le projet Android
        run: |
          npx cap init EduBF com.edubf.app --web-dir=EduBF
          npx cap add android
          npx cap sync
      - name: Corriger les doublons
        run: |
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle
      - name: Construire l APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: EduBF-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
